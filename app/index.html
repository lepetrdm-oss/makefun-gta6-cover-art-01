<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Cover Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">SUNSET <span>COVER</span> STUDIO</div>
  <div class="tagline">GTA-style cover art from any photo — fully offline</div>
</header>

<main class="layout">
  <aside id="controls">
    <section>
      <h2>Looks</h2>
      <div class="row">
        <button type="button" data-look="key">Key Art</button>
        <button type="button" data-look="neon">Neon Portrait</button>
        <button type="button" data-look="golden">Golden Grid</button>
      </div>
    </section>

    <section>
      <h2>Layout</h2>
      <div class="row" id="layoutGroup"></div>
    </section>

    <section>
      <h2>Grade</h2>
      <div class="row" id="gradeGroup"></div>
    </section>

    <section>
      <h2>Export size</h2>
      <select id="sizeSel">
        <option value="1080x1080">Square - 1080 x 1080</option>
        <option value="1080x1350">Portrait - 1080 x 1350</option>
        <option value="1920x1080">Wide - 1920 x 1080</option>
      </select>
    </section>

    <section>
      <h2>Caption</h2>
      <label>Title <input id="titleIn" type="text" maxlength="40"></label>
      <label>Subtitle <input id="subIn" type="text" maxlength="48"></label>
      <label>Title size <input id="titleSize" type="range" min="0.07" max="0.16" step="0.005"></label>
      <label>Title position <input id="titleY" type="range" min="0.5" max="0.92" step="0.01"></label>
      <label>Title tilt <input id="titleTilt" type="range" min="-8" max="8" step="0.5"></label>
    </section>

    <section>
      <h2>Panel photo</h2>
      <div class="row" id="panelTabs"></div>
      <div class="row" id="sampleRow"></div>
      <label>Upload your own <input id="uploadIn" type="file" accept="image/*"></label>
      <label>Zoom <input id="zoom" type="range" min="0.6" max="2.5" step="0.01"></label>
      <div class="row">
        <button type="button" id="resetCrop">Reset crop</button>
        <button type="button" id="useAll">Use in all panels</button>
      </div>
      <p class="hint">Drag the cover to pan the selected panel's photo, or drop a photo file onto the cover.</p>
    </section>

    <section>
      <button type="button" id="exportBtn" class="export">Export PNG</button>
    </section>
  </aside>

  <section class="stage-wrap">
    <canvas id="stage" width="1920" height="1080"></canvas>
  </section>
</main>

<script type="module" src="src/main.js"></script>
</body>
</html>
