<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Cover Studio — GTA 6-style cover maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">SUNSET <span>COVER STUDIO</span></div>
  <p class="tagline">Turn any photo into a GTA 6-style cover. Works fully offline.</p>
</header>
<main class="layout">
  <section class="stage" id="stage">
    <canvas id="cover" width="1920" height="1080"></canvas>
    <p class="hint">Drag a panel to pan its photo. Select a panel below to fine-tune it.</p>
  </section>
  <aside class="controls">
    <div class="group">
      <h2>Looks</h2>
      <div class="btnrow" id="looks"></div>
    </div>
    <div class="group">
      <h2>Layout</h2>
      <div class="btnrow" id="layouts"></div>
    </div>
    <div class="group">
      <h2>Colour grade</h2>
      <div class="btnrow" id="grades"></div>
    </div>
    <div class="group">
      <h2>Caption</h2>
      <label class="field">Title
        <input id="title" type="text" maxlength="42" autocomplete="off">
      </label>
      <label class="field">Subtitle
        <input id="subtitle" type="text" maxlength="60" autocomplete="off">
      </label>
    </div>
    <div class="group">
      <h2>Export size</h2>
      <select id="size"></select>
      <button id="exportBtn" class="primary" type="button">Export PNG</button>
    </div>
    <div class="group">
      <h2>Panels</h2>
      <div id="panels"></div>
    </div>
  </aside>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
